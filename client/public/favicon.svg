<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Background rounded square -->
  <rect width="64" height="64" rx="14" fill="#0f172a"/>

  <!-- Pulse / EKG line across middle -->
  <polyline
    points="4,36 14,36 18,20 22,46 26,28 30,36 36,36 40,16 44,44 48,36 60,36"
    stroke="#22d3ee"
    stroke-width="2.8"
    stroke-linecap="round"
    stroke-linejoin="round"
    fill="none"
  />

  <!-- Candlestick bars below the line for finance context -->
  <!-- Bar 1 (green) -->
  <rect x="10" y="44" width="5" height="8" rx="1" fill="#4ade80"/>
  <line x1="12.5" y1="42" x2="12.5" y2="44" stroke="#4ade80" stroke-width="1.5"/>
  <line x1="12.5" y1="52" x2="12.5" y2="54" stroke="#4ade80" stroke-width="1.5"/>

  <!-- Bar 2 (red) -->
  <rect x="22" y="46" width="5" height="6" rx="1" fill="#f87171"/>
  <line x1="24.5" y1="44" x2="24.5" y2="46" stroke="#f87171" stroke-width="1.5"/>
  <line x1="24.5" y1="52" x2="24.5" y2="55" stroke="#f87171" stroke-width="1.5"/>

  <!-- Bar 3 (green) -->
  <rect x="34" y="43" width="5" height="9" rx="1" fill="#4ade80"/>
  <line x1="36.5" y1="41" x2="36.5" y2="43" stroke="#4ade80" stroke-width="1.5"/>
  <line x1="36.5" y1="52" x2="36.5" y2="55" stroke="#4ade80" stroke-width="1.5"/>

  <!-- Bar 4 (green) -->
  <rect x="46" y="42" width="5" height="10" rx="1" fill="#4ade80"/>
  <line x1="48.5" y1="40" x2="48.5" y2="42" stroke="#4ade80" stroke-width="1.5"/>
  <line x1="48.5" y1="52" x2="48.5" y2="55" stroke="#4ade80" stroke-width="1.5"/>
</svg>
